# Settings for Cloudflare's "wrangler" tool, which puts relay.js online.
# The keys are NOT here: they are Cloudflare secrets (wrangler secret put PPT_API_KEY, for PSA
# prices, and wrangler secret put TCG_API_KEY, for the card database).
# The name is from when the relay only fetched PSA prices; it is part of the relay's address.
name = "kortpris-psa"
main = "relay.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Where each card's PSA prices are remembered for a day (made with: wrangler kv namespace create).
[[kv_namespaces]]
binding = "REMEMBERED"
id = "dfee0657feef42ddbee9acb2322f8488"
