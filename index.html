<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kortpris</title>
<meta name="description" content="Photograph a Pokémon card and see what it sells for on Cardmarket and TCGplayer.">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141D" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='5' y='1' width='22' height='30' rx='3' fill='%23F5C518'/%3E%3Crect x='8' y='4' width='16' height='13' rx='1.5' fill='%23141C28'/%3E%3C/svg%3E">
<!-- On the home screen: its name, picture and full-screen look (see sw.js and README). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Kortpris">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- crossorigin lets the service worker keep a copy of the fonts (sw.js). -->
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@500&display=swap" crossorigin>
<link rel="stylesheet" href="style.css?v=1.39.1">
</head>
<body>

<main class="wrap">
	<header class="masthead">
		<svg class="mark" viewBox="0 0 30 40" aria-hidden="true">
			<rect class="card-edge" x="0" y="0" width="30" height="40" rx="3"/>
			<rect class="card-art" x="4" y="4" width="22" height="16" rx="1.5"/>
		</svg>
		<h1 class="brand">Kortpris</h1>
		<div class="header-controls">
			<button type="button" id="kids-button" class="header-button kids-button" aria-pressed="false" data-label="kidsModeLabel">
				<span aria-hidden="true">🧒</span> <span data-text="kidsMode"></span>
			</button>
			<div class="language-switch" role="group" data-label="languageSwitch">
				<button type="button" data-language="da" lang="da" aria-pressed="false">DA</button>
				<button type="button" data-language="en" lang="en" aria-pressed="false">EN</button>
			</div>
			<!-- Opens the install guide further down. On a phone it shares the second line with the
			     currency. Hidden in the installed app (renderInstall in app.js). -->
			<button type="button" id="install-open" class="header-button">
				<span aria-hidden="true">📲</span> <span data-text="installApp"></span>
			</button>
			<label for="currency-select" class="visually-hidden" data-text="currencyLabel"></label>
			<select id="currency-select" class="currency-select">
				<option value="DKK">DKK</option>
				<option value="EUR">EUR</option>
				<option value="GBP">GBP</option>
				<option value="IDR">IDR</option>
			</select>
		</div>
		<p class="tagline" data-text="tagline"></p>
	</header>

	<div class="view-switch" role="group" data-label="views">
		<button type="button" data-view="scan" aria-pressed="true">
			<span class="icon" aria-hidden="true">📷</span> <span data-text="viewScan"></span>
		</button>
		<button type="button" data-view="collection" aria-pressed="false">
			<span class="icon" aria-hidden="true">⭐</span> <span data-text="viewCollection"></span> <span id="collection-count" class="count"></span>
		</button>
	</div>

	<div id="scan-view" class="view">
		<section id="intro" class="intro" data-label="howItWorks">
			<ol class="steps">
				<li><span><strong data-text="step1Verb"></strong><span data-text="step1Rest"></span></span></li>
				<li><span><strong data-text="step2Verb"></strong><span data-text="step2Rest"></span></span></li>
				<li><span><strong data-text="step3Verb"></strong><span data-text="step3Rest"></span></span></li>
			</ol>
			<button id="example-button" class="text-button" type="button" data-text="tryExample"></button>
			<!-- Kids mode only: a big picture to tap instead of reading the steps above. -->
			<button id="kid-start" class="kid-start" type="button">
				<svg class="kid-start-picture" viewBox="0 0 120 120" aria-hidden="true">
					<path class="viewfinder" d="M8 30V14a6 6 0 0 1 6-6h16M90 8h16a6 6 0 0 1 6 6v16M112 90v16a6 6 0 0 1-6 6H90M30 112H14a6 6 0 0 1-6-6V90"/>
					<rect class="card-edge" x="35" y="20" width="50" height="70" rx="4"/>
					<rect class="card-body" x="39" y="24" width="42" height="62" rx="2"/>
					<rect class="card-art" x="43" y="31" width="34" height="24" rx="1.5"/>
					<rect class="card-line" x="43" y="61" width="30" height="4" rx="2"/>
					<rect class="card-line" x="43" y="69" width="22" height="4" rx="2"/>
				</svg>
				<span class="kid-start-text"><span aria-hidden="true">📷</span> <span data-text="kidIdle"></span></span>
			</button>
		</section>

		<section class="panel lookup" data-label="yourCard">
			<div id="scan-row" class="scan-row no-photo">
				<img id="photo-thumb" class="photo-thumb" data-alt="yourPhoto" alt="" hidden>
				<div>
					<p id="status" class="status" role="status" aria-live="polite"></p>
					<p id="notice" class="notice" hidden></p>
					<div id="progress" class="progress" hidden><div id="progress-bar" class="progress-bar"></div></div>
				</div>
			</div>
			<form id="search-form" class="fields" autocomplete="off">
				<div class="field">
					<label for="name-input" data-text="nameLabel"></label>
					<input id="name-input" type="text" autocapitalize="words" spellcheck="false" enterkeyhint="search" data-placeholder="namePlaceholder">
				</div>
				<div class="field-row">
					<div class="field">
						<label for="number-input" data-text="numberLabel"></label>
						<input id="number-input" type="text" autocapitalize="characters" spellcheck="false" enterkeyhint="search" data-placeholder="numberPlaceholder">
					</div>
					<button id="search-button" class="button secondary" type="submit" data-text="search"></button>
				</div>
			</form>
		</section>

		<section id="detail" class="panel detail" aria-live="polite" hidden></section>

		<section id="results" class="results" hidden>
			<h2 class="section-title" data-text="resultsTitle"></h2>
			<p id="results-note" class="note"></p>
			<div id="results-grid" class="grid"></div>
		</section>

		<details id="claude-settings" class="panel settings">
			<summary>
				<span data-text="claudeTitle"></span>
				<span id="claude-state" class="state"></span>
			</summary>
			<div class="settings-body">
				<p data-text="claudeExplain"></p>
				<form id="claude-form" class="fields" autocomplete="off">
					<div class="field">
						<label for="claude-key-input" data-text="claudeKeyLabel"></label>
						<input id="claude-key-input" type="password" autocomplete="off" spellcheck="false" data-placeholder="claudeKeyPlaceholder">
					</div>
					<p class="hint">
						<span data-text="claudeKeyHelpBefore"></span><a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a><span data-text="claudeKeyHelpAfter"></span>
					</p>
					<div class="settings-buttons">
						<button type="submit" class="button secondary" data-text="claudeSave"></button>
						<button type="button" id="claude-remove" class="button secondary" data-text="claudeRemove"></button>
					</div>
					<p id="claude-message" class="note" role="status"></p>
				</form>
				<p class="fineprint" data-text="claudePrivacy"></p>
			</div>
		</details>

		<details id="learned-settings" class="panel settings">
			<summary>
				<span data-text="learnedTitle"></span>
				<span id="learned-count" class="state"></span>
			</summary>
			<div class="settings-body">
				<p data-text="learnedExplain"></p>
				<p id="learned-none" class="note" data-text="learnedNone"></p>
				<ul id="learned-list" class="collection-list"></ul>
				<div class="settings-buttons">
					<button type="button" id="forget-all-learned" class="button secondary" data-text="learnedForgetAll"></button>
				</div>
				<p id="learned-where" class="fineprint" role="status"></p>
			</div>
		</details>

		<details id="voice-settings" class="panel settings">
			<summary><span data-text="voiceTitle"></span></summary>
			<div class="settings-body">
				<p data-text="voiceExplain"></p>
				<div class="field">
					<label for="voice-da" data-text="voiceDanish"></label>
					<div class="field-row">
						<select id="voice-da" class="voice-select" data-voice-language="da"></select>
						<button type="button" class="button secondary" data-try-voice="da" data-text="voiceTry"></button>
					</div>
				</div>
				<div class="field">
					<label for="voice-en" data-text="voiceEnglish"></label>
					<div class="field-row">
						<select id="voice-en" class="voice-select" data-voice-language="en"></select>
						<button type="button" class="button secondary" data-try-voice="en" data-text="voiceTry"></button>
					</div>
				</div>
				<p class="hint" data-text="voiceBetterIphone"></p>
				<p class="hint" data-text="voiceBetterAndroid"></p>
				<p class="hint" data-text="voiceBetterPc"></p>
			</div>
		</details>
	</div>

	<section id="collection-view" class="view" data-label="viewCollection" hidden>
		<!-- The list of saved cards. Tapping one shows its page instead (openSavedCard in app.js). -->
		<div id="collection-page" class="collection-page">
			<section id="account-panel" class="panel account" data-label="accountTitle" hidden>
				<div id="signed-out" class="account-part">
					<h2 class="section-title" data-text="accountTitle"></h2>
					<p class="note" data-text="accountExplain"></p>
					<div class="view-switch compact" role="group" data-label="accountModes">
						<button type="button" data-account-mode="sign-in" aria-pressed="true" data-text="signIn"></button>
						<button type="button" data-account-mode="create" aria-pressed="false" data-text="createAccount"></button>
					</div>
					<form id="account-form" class="fields">
						<div class="field">
							<label for="username-input" data-text="usernameLabel"></label>
							<input id="username-input" type="text" autocomplete="username" autocapitalize="none" spellcheck="false">
							<p id="username-hint" class="hint" data-text="usernameHint" hidden></p>
						</div>
						<div class="field">
							<label for="password-input" data-text="passwordLabel"></label>
							<div class="password-row">
								<input id="password-input" type="password" autocomplete="current-password">
								<button type="button" id="show-password" class="button secondary" aria-pressed="false"></button>
							</div>
						</div>
						<div id="create-only" class="fields" hidden>
							<div id="strength-meter" class="strength" aria-hidden="true">
								<span></span><span></span><span></span><span></span>
							</div>
							<p id="password-feedback" class="hint" aria-live="polite"></p>
							<div class="field">
								<label for="password-again-input" data-text="passwordAgainLabel"></label>
								<input id="password-again-input" type="password" autocomplete="new-password">
							</div>
						</div>
						<button id="account-submit" type="submit" class="button primary"></button>
					</form>
				</div>
				<div id="signed-in" class="account-part" hidden>
					<div class="signed-in-row">
						<p class="signed-in-as"><span data-text="signedInAs"></span> <strong id="account-name"></strong></p>
						<button type="button" id="sign-out" class="button secondary" data-text="signOut"></button>
					</div>
					<div id="phone-cards-offer" class="phone-cards" hidden>
						<p id="phone-cards-text" class="note"></p>
						<button type="button" id="move-cards" class="button secondary" data-text="moveCards"></button>
					</div>
				</div>
				<p id="account-message" class="note" role="status"></p>
			</section>
			<div id="collection-summary" class="panel collection-summary"></div>
			<div id="collection-search-row" class="field collection-search" hidden>
				<label for="collection-search" data-text="collectionSearchLabel"></label>
				<input id="collection-search" type="search" data-placeholder="collectionSearchPlaceholder" autocomplete="off" spellcheck="false" enterkeyhint="search">
				<p id="collection-search-note" class="hint" role="status"></p>
				<!-- The order of the list, and sharing it as text (see shareCollection in app.js). -->
				<div class="collection-tools">
					<label for="collection-sort" data-text="collectionSortLabel"></label>
					<select id="collection-sort" class="sort-select">
						<option value="value" data-text="sortValue"></option>
						<option value="name" data-text="sortName"></option>
						<option value="set" data-text="sortSet"></option>
						<option value="newest" data-text="sortNewest"></option>
					</select>
					<button type="button" id="collection-share" class="button secondary">
						<span aria-hidden="true">📤</span> <span data-text="shareList"></span>
					</button>
				</div>
				<p id="collection-share-note" class="hint" role="status"></p>
			</div>
			<!-- The saved cards, in a group for each kind: Pokémon, Trainer and Energy cards. -->
			<div id="collection-list" class="collection-groups"></div>
			<p id="collection-where" class="fineprint"></p>
		</div>
		<!-- A saved card's page: the same page the Scan screen shows for a card it found. -->
		<div id="saved-card-view" class="saved-card-view" hidden>
			<button type="button" id="saved-card-back" class="button secondary back-button">
				<span class="back-arrow" aria-hidden="true">‹</span> <span data-text="backToCollection"></span>
			</button>
			<section id="saved-card" class="panel detail" aria-live="polite"></section>
		</div>
	</section>

	<footer>
		<p><span data-text="footerBefore"></span><a href="https://tcgdex.dev" target="_blank" rel="noopener" data-text="footerLink"></a><span data-text="footerAfter"></span></p>
		<p id="rates-note"></p>
		<p id="app-version" class="app-version"></p>
	</footer>
</main>

<!-- The rainbow glitter on the little version pictures in kids mode (see versionPictureHtml in app.js). -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
	<defs>
		<linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#FF8FD8"/>
			<stop offset="0.35" stop-color="#8FD3FF"/>
			<stop offset="0.65" stop-color="#B8FF9F"/>
			<stop offset="1" stop-color="#FFE38F"/>
		</linearGradient>
	</defs>
</svg>

<nav class="actionbar" data-label="scanBar">
	<div class="actionbar-inner">
		<button id="camera-button" class="button primary" type="button">
			<span class="icon" aria-hidden="true">📷</span> <span data-text="takePhoto"></span>
		</button>
		<button id="library-button" class="button secondary" type="button" data-label="choosePhoto">
			<span class="icon" aria-hidden="true">🖼️</span> <span class="button-words" data-text="choosePhoto"></span>
		</button>
	</div>
	<!-- capture="environment" opens the phone's own camera (used when the app's camera can't start);
	     the second input opens the photo library -->
	<input id="camera-input" class="visually-hidden" type="file" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
	<input id="library-input" class="visually-hidden" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
</nav>

<!-- "Install app" at the top: how to put Kortpris on the home screen, device by device. The guide
     for the device in hand is marked and comes first (renderInstall and openInstallGuide in app.js). -->
<dialog id="install-dialog" class="install-dialog" aria-labelledby="install-title">
	<div class="install-sheet">
		<div class="install-head">
			<h2 id="install-title" data-text="installTitle"></h2>
			<button type="button" id="install-close" class="install-close" data-label="closeLabel">✕</button>
		</div>
		<p data-text="installExplain"></p>
		<!-- Where the browser offered to install (Android, Chrome, Edge), one tap does it. -->
		<div id="install-button-row" class="settings-buttons" hidden>
			<button type="button" id="install-button" class="button primary" data-text="installButton"></button>
		</div>
		<div class="install-guides">
			<details class="panel settings install-guide" data-device="iphone">
				<summary><span data-text="installIphoneTitle"></span> <span class="state on install-yours" data-text="installYourDevice"></span></summary>
				<div class="settings-body">
					<ol class="install-steps">
						<li data-text="installIphone1"></li>
						<li data-text="installIphone2"></li>
						<li data-text="installIphone3"></li>
						<li data-text="installIphone4"></li>
					</ol>
					<p class="hint" data-text="installIphoneOther"></p>
					<p id="install-iphone-storage" class="hint" data-text="installIphoneStorage" hidden></p>
				</div>
			</details>
			<details class="panel settings install-guide" data-device="android">
				<summary><span data-text="installAndroidTitle"></span> <span class="state on install-yours" data-text="installYourDevice"></span></summary>
				<div class="settings-body">
					<ol class="install-steps">
						<li data-text="installAndroid1"></li>
						<li data-text="installAndroid2"></li>
						<li data-text="installAndroid3"></li>
					</ol>
					<p class="hint" data-text="installAndroidSamsung"></p>
				</div>
			</details>
			<details class="panel settings install-guide" data-device="chromebook">
				<summary><span data-text="installChromebookTitle"></span> <span class="state on install-yours" data-text="installYourDevice"></span></summary>
				<div class="settings-body">
					<ol class="install-steps">
						<li data-text="installOpenChrome"></li>
						<li data-text="installAddressIcon"></li>
						<li data-text="installChromebookDone"></li>
					</ol>
					<p class="hint" data-text="installChromeMenu"></p>
				</div>
			</details>
			<details class="panel settings install-guide" data-device="computer">
				<summary><span data-text="installComputerTitle"></span> <span class="state on install-yours" data-text="installYourDevice"></span></summary>
				<div class="settings-body">
					<ol class="install-steps">
						<li data-text="installOpenChromeEdge"></li>
						<li data-text="installAddressIcon"></li>
						<li data-text="installComputerDone"></li>
					</ol>
					<p class="hint" data-text="installChromeMenu"></p>
					<p class="hint" data-text="installEdgeMenu"></p>
					<p class="hint" data-text="installMacSafari"></p>
				</div>
			</details>
			<details class="panel settings install-guide" data-device="other">
				<summary><span data-text="installOtherTitle"></span> <span class="state on install-yours" data-text="installYourDevice"></span></summary>
				<div class="settings-body">
					<p class="hint" data-text="installOtherBrowsers"></p>
				</div>
			</details>
		</div>
	</div>
</dialog>

<!-- The app's own camera (camera.js): the live picture, a frame to fill with the card, and buttons. -->
<div id="live-camera" class="live-camera" hidden>
	<!-- Shaped like the camera's picture, so the frame covers the same part of the photo as on screen. -->
	<div class="camera-stage">
		<div id="camera-box" class="camera-box">
			<video id="camera-video" class="camera-video" playsinline muted autoplay></video>
			<div id="camera-frame" class="camera-frame" aria-hidden="true"></div>
		</div>
	</div>
	<p id="camera-message" class="camera-message" role="status"></p>
	<button type="button" id="camera-close" class="camera-round camera-close" data-label="cameraClose">✕</button>
	<!-- "Auto": the photo is taken by itself once the card fills the frame (watchForCard in app.js). -->
	<button type="button" id="camera-auto" class="camera-round camera-auto" data-label="cameraAuto" data-text="cameraAutoShort" aria-pressed="false" hidden></button>
	<div class="camera-controls">
		<button type="button" id="camera-light" class="camera-round" data-label="cameraLight" aria-pressed="false">🔦</button>
		<button type="button" id="camera-shutter" class="camera-shutter" data-label="takePhoto"></button>
		<button type="button" id="camera-zoom" class="camera-round camera-zoom" data-label="cameraZoom"></button>
	</div>
	<button type="button" id="camera-phone" class="camera-phone" data-text="cameraUsePhone"></button>
</div>

<!-- Our own files (these, and style.css at the top) end in ?v=1.39.1. Change it on every
     release (see README), so phones never mix new and old files from their cache. -->
<!-- Tesseract reads text out of pictures (OCR = optical character recognition). -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@7.0.0/dist/tesseract.min.js" crossorigin="anonymous"></script>
<script src="strings.js?v=1.39.1"></script>
<script src="pokemon-names.js?v=1.39.1"></script>
<script src="card-names.js?v=1.39.1"></script>
<script src="storage.js?v=1.39.1"></script>
<script src="currency.js?v=1.39.1"></script>
<script src="firebase-config.js?v=1.39.1"></script>
<script src="password.js?v=1.39.1"></script>
<script src="account.js?v=1.39.1"></script>
<script src="speech.js?v=1.39.1"></script>
<script src="card-finder.js?v=1.39.1"></script>
<script src="sparkle.js?v=1.39.1"></script>
<script src="reader.js?v=1.39.1"></script>
<script src="card-ids.js?v=1.39.1"></script>
<script src="cards.js?v=1.39.1"></script>
<script src="matcher.js?v=1.39.1"></script>
<script src="learned.js?v=1.39.1"></script>
<script src="camera.js?v=1.39.1"></script>
<script src="collection.js?v=1.39.1"></script>
<script src="graded.js?v=1.39.1"></script>
<script src="claude.js?v=1.39.1"></script>
<script src="app.js?v=1.39.1"></script>
</body>
</html>
